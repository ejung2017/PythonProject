name: Deploy portfolio site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # Key is stored base64-encoded: GitHub's secret field strips trailing
      # whitespace, and ssh refuses a key with no final newline.
      - name: Load deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null   # fails loudly if malformed

      # --delete removes files that no longer exist in the build.
      - name: Deploy
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            web/dist/ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/eunahjung.app/
